# Local ATLAS + WebAPI + PostgreSQL for importing inst/cohorts/*.circe.json (ATLAS 2.13+ supports DateAdjustment; WebAPI 2.14 and 2.15 cannot generate cohorts on a DuckDB source ("Unsupported data source dialect: duckdb")).
#   docker compose -f scripts/atlas/docker-compose.yml up -d
#   python scripts/atlas/import_circe.py --webapi http://localhost:18080/WebAPI
# Ports are deliberately non-default (WebAPI 18080, ATLAS 18081, PostgreSQL 15432). Throwaway credentials; ports bind to 127.0.0.1 only because WebAPI runs with DisabledSecurity and open CORS.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ohdsi
      POSTGRES_PASSWORD: ohdsi_local_only
      POSTGRES_DB: ohdsi
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["./initdb:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohdsi"]
      interval: 5s
      retries: 20
  webapi:
    image: ohdsi/webapi:2.15.2
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      # No DuckDB JDBC mount: WebAPI rejects DuckDB sources, and a missing ./jdbc/duckdb_jdbc.jar (gitignored) made Docker create a directory there.
      - ./data:/data
    environment:
      DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/ohdsi
      DATASOURCE_USERNAME: ohdsi
      DATASOURCE_PASSWORD: ohdsi_local_only
      DATASOURCE_OHDSI_SCHEMA: webapi
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: webapi
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: webapi.BATCH_
      FLYWAY_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      FLYWAY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ohdsi
      FLYWAY_DATASOURCE_USERNAME: ohdsi
      FLYWAY_DATASOURCE_PASSWORD: ohdsi_local_only
      FLYWAY_SCHEMAS: webapi
      FLYWAY_PLACEHOLDERS_OHDSISCHEMA: webapi
      FLYWAY_LOCATIONS: classpath:db/migration/postgresql
      SECURITY_PROVIDER: DisabledSecurity
      SECURITY_CORS_ENABLED: "true"
      SECURITY_ORIGIN: "*"
  atlas:
    image: ohdsi/atlas:2.15.0
    depends_on: [webapi]
    ports: ["127.0.0.1:18081:8080"]
    environment:
      WEBAPI_URL: http://localhost:18080/WebAPI/
