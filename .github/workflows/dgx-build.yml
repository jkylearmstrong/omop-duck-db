name: DGX Image Build (arm64, no GPU)

# Validates that Dockerfile.dgx builds cleanly for linux/arm64 (DGX Spark / Grace-Blackwell)
# without requiring a GPU runner, and checks key Python/ML/Quarto library versions against
# config/reference_env.json (0.36.0, M4 + M3). Runs weekly, on version tags, and manually.

on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-dgx-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.dgx (linux/arm64, build-only, no GPU)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dgx
          platforms: linux/arm64
          push: false
          load: true
          tags: omopduckdb:dgx-ci
          cache-from: type=gha,scope=dgx-arm64
          cache-to: type=gha,mode=max,scope=dgx-arm64

      - name: Check DGX image libraries against reference_env.json (M3)
        run: python3 scripts/check_env.py --image omopduckdb:dgx-ci --skip-r --policy compatible

      - name: Non-GPU study smoke check inside DGX image
        run: docker run --rm omopduckdb:dgx-ci study-smoke
