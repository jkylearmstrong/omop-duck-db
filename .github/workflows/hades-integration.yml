name: HADES integration

# Optional: runs the real OHDSI CohortGenerator on cohort_definition_set() against a DuckDB CDM fixture
# (tests/testthat/test-cohortgenerator-integration.R). Not part of the required CI; trigger by hand or by a change
# to the cohort files / R bridge.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cohorts/**"
      - "R/cohort_definition_set.R"
      - "tests/testthat/test-cohortgenerator-integration.R"
      - ".github/workflows/hades-integration.yml"

jobs:
  cohortgenerator:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::CohortGenerator, any::DatabaseConnector, any::SqlRender, any::duckdb
          needs: check

      - name: Run CohortGenerator on the DuckDB fixture
        run: |
          Rscript -e 'options(testthat.progress.max_fails = 1); res <- testthat::test_file("tests/testthat/test-cohortgenerator-integration.R", package = "omopduckdb", load_package = "source", reporter = "summary", stop_on_failure = TRUE); df <- as.data.frame(res); stopifnot(sum(df$skipped) == 0, sum(df$passed) >= 3)'
