name: Release (Docker -> GHCR)

# Builds the image (which runs both test suites at build time, see Dockerfile) on every version tag push and
# publishes it to GitHub Container Registry as ghcr.io/<owner>/<repo>:<version> and :latest, e.g. for tag v0.9.0:
#   docker pull ghcr.io/jkylearmstrong/omop-duck-db:0.9.0
# Uses the workflow's own GITHUB_TOKEN; no secrets to configure. After the first publish, set the package's
# visibility to public under the repository's Packages settings if anonymous pulls are wanted.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
