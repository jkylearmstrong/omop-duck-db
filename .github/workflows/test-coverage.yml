name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, local::.
          needs: coverage

      - name: Calculate R Test Coverage
        run: Rscript -e 'covr::to_sonarqube(covr::package_coverage(), file = "r_coverage.xml")'
        shell: Rscript {0}

      - name: Upload R Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: r-coverage-report
          path: r_coverage.xml
          if-no-files-found: ignore

  python-coverage:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package (required by parity tests)
        run: Rscript -e 'install.packages(c("DBI","duckdb","stringr","yaml")); install.packages(".", repos = NULL, type = "source")'
        shell: Rscript {0}

      - name: Install Python package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest tests/ --cov=python/omop_etl --cov-report=xml:py_coverage.xml --cov-report=term

      - name: Upload Python Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: py_coverage.xml
          if-no-files-found: ignore
