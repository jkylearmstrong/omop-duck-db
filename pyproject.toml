[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omop-duck-db"
version = "0.6.8"
description = "Tools for building an OMOP CDM v5.4 DuckDB database and mapping PCORnet-format source data into it."
readme = "README.md"
license = "MIT"
authors = [{ name = "J Kyle Armstrong" }]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0,<2.0",
    "pandas>=2.0,<3.0",
    "pyarrow>=15.0,<19.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# ML bridge: scipy for sparse concept matrices. omop-learn itself is not on PyPI; install it from GitHub
# (pip install git+https://github.com/clinicalml/omop-learn) to use DuckDBBackend with its models.
ml = ["scipy>=1.10"]
# Source-database extras (FR-B1): SQLAlchemy plus the engine driver.
sql = ["sqlalchemy>=1.4"]
postgres = ["sqlalchemy>=1.4", "psycopg2-binary"]
mssql = ["sqlalchemy>=1.4", "pyodbc"]
oracle = ["sqlalchemy>=1.4", "oracledb"]
snowflake = ["sqlalchemy>=1.4", "snowflake-sqlalchemy"]
# Model bundles (FR-A1): native XGBoost JSON and ONNX runtimes.
bundle = ["xgboost>=2.0", "onnxruntime>=1.16"]
dev = ["pytest>=7.0,<9.0", "pytest-cov>=4.0", "coverage>=7.0", "build>=1.0", "twine>=5.0", "scipy>=1.10", "tabulate", "jinja2", "openpyxl", "sqlalchemy>=1.4"]

[project.scripts]
omop-etl-pcornet = "omop_etl.build_omop_cdm:main"
omop-duckdb = "omop_etl.cli:main"
omop-duckdb-cli = "omop_etl.cli:main"

[project.urls]
Homepage = "https://github.com/jkylearmstrong/omop-duck-db"

[tool.hatch.build.targets.wheel]
packages = ["python/omop_etl", "python/omop_duck_db"]

# Bundle the shared DDL/macros SQL (single source of truth under inst/, also
# used by the R package) into the wheel so a real (non-editable) `pip install`
# works, not just running from a git checkout.
[tool.hatch.build.targets.wheel.force-include]
"inst/sql/mapping_macros.sql" = "omop_etl/resources/sql/mapping_macros.sql"
"inst/sql/cohort_readmission.sql" = "omop_etl/resources/sql/cohort_readmission.sql"
"inst/sql/cohort_mortality.sql" = "omop_etl/resources/sql/cohort_mortality.sql"
"inst/sql/table1_aggregations.sql" = "omop_etl/resources/sql/table1_aggregations.sql"
"inst/sql/omop_learn" = "omop_etl/resources/sql/omop_learn"
"inst/extdata/5.4/duckdb/OMOPCDM_duckdb_5.4_ddl.sql" = "omop_etl/resources/extdata/5.4/duckdb/OMOPCDM_duckdb_5.4_ddl.sql"
"inst/extdata/comorbidity" = "omop_etl/resources/extdata/comorbidity"
"inst/extdata/code_lists" = "omop_etl/resources/extdata/code_lists"
"inst/extdata/physiologic_limits.csv" = "omop_etl/resources/extdata/physiologic_limits.csv"
"inst/extdata/telemetry_packet.schema.json" = "omop_etl/resources/extdata/telemetry_packet.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "python"]
filterwarnings = [
    "ignore::UserWarning:pandas.core.arrays.masked",
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
